site_name: yex
site_description: typeset beautifully
site_author: Marnanel Thurman
site_url: !ENV READTHEDOCS_CANONICAL_URL

copyright: "(c) 2023-2025 Marnanel Thurman"

repo_name: gitlab
repo_url: https://gitlab.com/marnanel/yex/

theme:
  name: material
  logo: _static/icon.svg
  highlightjs: true
  palette:

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: white
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

nav:
  - Introduction: index.md
  - How to install Yex: installing.md
  - Controls: controls.md
  - An overview:
    - Top-level overview: overview.md
    - Controls: ref/yex.control.Control.md
  - Running yex: running.md
  - Reference:
    - Document state:
      - What is a document?: ref/yex.Document.md
      - ref/yex.document.Callframe.md
      - ref/yex.document.Group.md
    - Boxes:
