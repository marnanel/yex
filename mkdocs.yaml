plugins:
  - search
  - autorefs
  - mkdocstrings:
      enabled: !ENV [ENABLE_DOCSTRINGS, true]
      locale: en_GB
      default_handler: python
      enable_inventory: true
      handlers:
        python:
          inventories:
          - https://docs.python.org/3/objects.inv
          - https://yex.readthedocs.io/en/latest/objects.inv
          options:
            docstring_style: google
            line_length: 100
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: true
            skip_local_inventory: true
            merge_init_into_class: true
            annotations_path: full
            show_signature: false
            extensions:
              - 'docs/griffe_extension/tex_word.py'
  - literate-nav

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.arithmatex
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: "!!python/name:mermaid2.fence_mermaid"
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: "#"
  - markdown_include.include:
      base_path: .

extra_javascript:
  - readthedocs.js

extra_css:
  - stylesheets/yex.css

docs_dir:
  docs
